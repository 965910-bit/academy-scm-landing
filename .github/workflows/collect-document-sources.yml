name: Collect public document sources
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/collect-document-sources.py
      - .github/workflows/collect-document-sources.yml
permissions:
  contents: write
jobs:
  collect:
    if: github.ref_name == 'arena/c841e6ff-academy-scm-landing'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/collect-document-sources.py
      - name: Save public source PDFs on current session branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add academy/documents/sources
          git diff --cached --quiet && exit 0
          git commit -m 'Collect public normative PDFs and clearly marked third-party examples'
          git push origin "HEAD:$TARGET_BRANCH"
