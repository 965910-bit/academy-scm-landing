name: Import OKPDTR source data
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/import-okpdtr.py
      - .github/workflows/import-okpdtr.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.13.4
      - run: python scripts/import-okpdtr.py --output imported/okpdtr.json --as-of 2026-11-19
      - uses: actions/upload-artifact@v4
        with:
          name: okpdtr-source
          path: imported/okpdtr.json
          if-no-files-found: error
          retention-days: 7
      - name: Save validated classifier on the requesting branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p academy/classifiers
          cp imported/okpdtr.json academy/classifiers/okpdtr.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add academy/classifiers/okpdtr.json
          git diff --cached --quiet && exit 0
          git commit -m "Import complete validated OK 016-2025 classifier (9935 records)"
          git push origin "HEAD:$TARGET_BRANCH"
