<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - SCM Академия</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0052CC;
            --primary-light: #4C9AFF;
            --secondary: #00B8D9;
            --accent: #36B37E;
            --dark: #172B4D;
            --light: #F4F5F7;
            --gray: #6B778C;
            --white: #FFFFFF;
            --shadow: 0 8px 30px rgba(23, 43, 77, 0.1);
            --radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: var(--dark);
            min-height: 100vh;
        }
        .dashboard-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
        }
        @media (max-width: 992px) {
            .dashboard-container {
                grid-template-columns: 1fr;
            }
        }
        /* Сайдбар */
        .sidebar {
            background: var(--white);
            border-right: 1px solid var(--light);
            padding: 30px 20px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }
        @media (max-width: 992px) {
            .sidebar {
                position: relative;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--light);
            }
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 40px;
            padding: 0 10px;
        }
        .user-profile {
            text-align: center;
            padding: 20px 10px;
            margin-bottom: 30px;
            background: rgba(0, 82, 204, 0.05);
            border-radius: var(--radius);
        }
        .user-avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
        }
        .user-name {
            font-weight: 700;
            margin-bottom: 5px;
        }
        .user-role {
            color: var(--gray);
            font-size: 0.9rem;
            background: rgba(0, 82, 204, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
        }
        .nav-menu {
            list-style: none;
            padding: 0;
        }
        .nav-item {
            margin-bottom: 8px;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            color: var(--dark);
            text-decoration: none;
            border-radius: var(--radius);
            transition: var(--transition);
        }
        .nav-link:hover, .nav-link.active {
            background: rgba(0, 82, 204, 0.1);
            color: var(--primary);
        }
        .nav-link i {
            width: 20px;
            text-align: center;
        }
        .logout-btn {
            width: 100%;
            margin-top: 30px;
            padding: 14px;
            background: transparent;
            color: var(--gray);
            border: 1px solid var(--light);
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: var(--transition);
        }
        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.2);
        }
        /* Основной контент */
        .main-content {
            padding: 40px;
            overflow-y: auto;
        }
        @media (max-width: 768px) {
            .main-content {
                padding: 20px;
            }
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }
        .header h1 {
            font-size: 2.2rem;
            color: var(--dark);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: var(--white);
            padding: 25px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border-top: 4px solid var(--primary);
        }
        .stat-card h3 {
            font-size: 0.95rem;
            color: var(--gray);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-value {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
        }
        .stat-change {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 10px;
            font-size: 0.9rem;
        }
        .stat-change.positive {
            color: var(--accent);
        }
        .stat-change.negative {
            color: #ef4444;
        }
        .courses-section {
            margin-bottom: 40px;
        }
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .course-card {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .course-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(23, 43, 77, 0.15);
        }
        .course-header {
            padding: 25px 25px 15px;
            border-bottom: 1px solid var(--light);
        }
        .course-category {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(0, 82, 204, 0.1);
            color: var(--primary);
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .course-title {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: var(--dark);
        }
        .course-instructor {
            color: var(--gray);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .course-body {
            padding: 20px 25px;
        }
        .course-progress {
            margin-bottom: 15px;
        }
        .progress-bar {
            height: 6px;
            background: var(--light);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 5px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 3px;
        }
        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--gray);
        }
        .course-footer {
            padding: 15px 25px 25px;
            border-top: 1px solid var(--light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: var(--white);
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        .btn-secondary {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .btn-secondary:hover {
            background: var(--primary);
            color: var(--white);
        }
        .recent-activity {
            background: var(--white);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: var(--shadow);
            margin-bottom: 40px;
        }
        .activity-list {
            list-style: none;
            padding: 0;
        }
        .activity-item {
            display: flex;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid var(--light);
        }
        .activity-item:last-child {
            border-bottom: none;
        }
        .activity-icon {
            width: 40px;
            height: 40px;
            background: rgba(0, 82, 204, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
        }
        .activity-content h4 {
            margin-bottom: 5px;
            font-size: 1rem;
        }
        .activity-content p {
            color: var(--gray);
            font-size: 0.9rem;
            margin-bottom: 5px;
        }
        .activity-time {
            font-size: 0.8rem;
            color: var(--gray);
        }
        .system-message {
            background: linear-gradient(135deg, #f0f7ff 0%, #e6f7ff 100%);
            border-radius: var(--radius);
            padding: 25px;
            margin-bottom: 40px;
            border-left: 4px solid var(--primary);
        }
        .system-message h3 {
            color: var(--primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .mobile-menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--dark);
            cursor: pointer;
            padding: 10px;
        }
        @media (max-width: 992px) {
            .mobile-menu-toggle {
                display: block;
            }
            .sidebar {
                display: none;
            }
            .sidebar.active {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Сайдбар -->
        <aside class="sidebar" id="sidebar">
            <a href="../index.html" class="logo">
                <i class="fas fa-network-wired"></i> SCM Академия
            </a>
            
            <div class="user-profile">
                <div class="user-avatar" id="userAvatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="user-name" id="userName">Демо Пользователь</div>
                <div class="user-role" id="userRole">Студент</div>
            </div>
            
            <nav>
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="#dashboard" class="nav-link active">
                            <i class="fas fa-tachometer-alt"></i>
                            <span>Панель управления</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#courses" class="nav-link">
                            <i class="fas fa-graduation-cap"></
