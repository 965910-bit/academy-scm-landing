<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Администратор | SCM Академия</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../auth-system.js"></script>
    <style>
        /* Дополнительные стили для админ панели */
        .dashboard {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
        }
        
        .sidebar {
            background: linear-gradient(135deg, #172B4D 0%, #0052CC 100%);
            color: white;
            padding: 30px 0;
        }
        
        .main-content {
            padding: 30px;
            background: #f8fafc;
        }
        
        /* Адаптивность и другие стили как в superadmin/index.html */
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- Боковая панель -->
        <aside class="sidebar">
            <div class="logo-area" style="padding: 0 25px 30px;">
                <a href="../index.html" class="logo" style="color: white;">
                    <i class="fas fa-graduation-cap"></i>
                    <span>SCM Академия</span>
                </a>
            </div>
            
            <nav class="nav-menu">
                <!-- Меню как в superadmin, но с ограниченными правами -->
            </nav>
        </aside>
        
        <!-- Основной контент -->
        <main class="main-content">
            <h1>Панель администратора</h1>
            <p>Добро пожаловать в панель управления администратора.</p>
            <!-- Остальной контент -->
        </main>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (!window.authSystem || !window.authSystem.checkSession()) {
                return;
            }
            
            const user = window.authSystem.getCurrentUser();
            if (user && user.role !== 'admin' && user.role !== 'superadmin') {
                alert('Доступ запрещен!');
                window.location.href = '../index.html';
            }
        });
    </script>
</body>
</html>
